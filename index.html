                    <!-- Połączenie z Supabase na żywo -->
                    <div class="lg:col-span-5 glass-card rounded-2xl p-6 border border-emerald-500/30 space-y-4 h-fit">
                        <div class="flex items-center justify-between">
                            <h3 class="font-display font-bold text-lg text-white flex items-center gap-2">
                                <i class="fa-solid fa-bolt text-emerald-400"></i> Twoje Połączenie Supabase
                            </h3>
                            <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                                WBUDOWANE W KOD
                            </span>
                        </div>
                        <p class="text-xs text-slate-300">Twoje klucze Supabase zostały już <strong>na stałe wpisane w kod pliku HTML</strong>! Dzięki temu każdy znajomy, który wejdzie na link z Netlify, automatycznie połączy się z Twoją bazą.</p>
                        
                        <div class="space-y-3 text-xs">
                            <div>
                                <label class="block text-slate-400 mb-1">Supabase Project URL (oczyszczony z /rest/v1/)</label>
                                <input id="sb-url-input" type="text" value="${activeCfg.url}"
                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-emerald-400 font-bold">
                            </div>
                            <div>
                                <label class="block text-slate-400 mb-1">Supabase Publishable / Anon Key</label>
                                <input id="sb-key-input" type="text" value="${activeCfg.key}"
                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-amber-300 font-mono text-[11px]">
                            </div>
                            <button onclick="connectSupabaseFromUI()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold uppercase tracking-wider transition">
                                <i class="fa-solid fa-rotate mr-1"></i> Testuj i Wyślij Stan do Bazy Supabase
                            </button>
                        </div>

                        <div class="pt-4 border-t border-slate-800 space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-amber-400">1. Skopiuj i uruchom ten kod w Supabase (SQL Editor):</span>
                                <button onclick="copySqlToClipboard()" class="px-2.5 py-1 rounded bg-emerald-500 text-slate-950 text-[11px] font-extrabold">
                                    <i class="fa-solid fa-copy mr-1"></i>Kopiuj SQL
                                </button>
                            </div>
                            <pre id="sql-code-block" class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-[11px] text-emerald-300 overflow-x-auto">${sqlScript}</pre>
                        </div>
                    </div>

                    <!-- Poradnik krok po kroku dla początkującego -->
                    <div class="lg:col-span-7 glass-card rounded-2xl p-6 border border-slate-800 space-y-4">
                        <h3 class="font-display font-bold text-lg text-white">
                            <i class="fa-solid fa-graduation-cap text-amber-400 mr-1.5"></i>Jak postawić stronę w 3 minuty (Supabase + GitHub + Netlify)
                        </h3>
                        <div class="space-y-4 text-xs text-slate-300 leading-relaxed">
                            <div class="p-4 rounded-xl bg-slate-900 border border-emerald-500/30">
                                <div class="font-extrabold text-emerald-400 text-sm mb-1">KROK 1: Utwórz tabelę w Twoim Supabase (30 sekund)</div>
                                <ol class="list-decimal list-inside space-y-1">
                                    <li>Twoje klucze są już wklejone w ten plik! Musisz tylko utworzyć tabelę w swoim projekcie Supabase.</li>
                                    <li>Wejdź na <strong>supabase.com</strong> → otwórz swój projekt.</li>
                                    <li>W menu po lewej kliknij ikonę <strong>SQL Editor</strong> → kliknij <strong>New query</strong>.</li>
                                    <li>Kliknij zielony przycisk <strong>Kopiuj SQL</strong> po lewej stronie, wklej kod w Supabase i kliknij <strong>Run</strong> (na dole po prawej).</li>
                                </ol>
                            </div>

                            <div class="p-4 rounded-xl bg-slate-900 border border-amber-500/30">
                                <div class="font-extrabold text-amber-400 text-sm mb-1">KROK 2: Wrzuć ten plik na GitHub jako <code>index.html</code> (1 minuta)</div>
                                <ol class="list-decimal list-inside space-y-1">
                                    <li>Pobierz/zapisz ten kod na swoim komputerze dokładnie pod nazwą <strong><code>index.html</code></strong>.</li>
                                    <li>Zaloguj się na <strong>github.com</strong>, kliknij <strong>+ (New repository)</strong> w prawym górnym rogu.</li>
                                    <li>Wpisz nazwę np. <code>fifa-arena</code>, zostaw zaznaczone <strong>Public</strong> i kliknij zielony przycisk <strong>Create repository</strong>.</li>
                                    <li>Na kolejnym ekranie kliknij niebieski napis <strong>uploading an existing file</strong>, przeciągnij swój plik <code>index.html</code> i kliknij na dole <strong>Commit changes</strong>.</li>
                                </ol>
                            </div>

                            <div class="p-4 rounded-xl bg-slate-900 border border-cyan-500/30">
                                <div class="font-extrabold text-cyan-400 text-sm mb-1">KROK 3: Połącz GitHub z Netlify (1 minuta)</div>
                                <ol class="list-decimal list-inside space-y-1">
                                    <li>Wejdź na <strong>app.netlify.com</strong> (zaloguj się najlepiej kontem GitHub).</li>
                                    <li>Kliknij przycisk <strong>Add new site</strong> → <strong>Import an existing project</strong> → wybierz <strong>GitHub</strong>.</li>
                                    <li>Wybierz z listy swoje repozytorium <code>fifa-arena</code>.</li>
                                    <li>Nic nie zmieniaj w polach formularza — od razu kliknij na dole przycisk <strong>Deploy fifa-arena</strong>.</li>
                                    <li>Po ok. 15 sekundach u góry pojawi się zielony link (np. <code>https://twojanazwa.netlify.app</code>) — wyślij go znajomym!</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function connectSupabaseFromUI() {
            const rawUrl = document.getElementById('sb-url-input').value.trim();
            const key = document.getElementById('sb-key-input').value.trim();
            if (!rawUrl || !key) {
                showToast('Wpisz zarówno Project URL jak i klucz API!', 'error');
                return;
            }
            const url = cleanSupabaseUrl(rawUrl);
            document.getElementById('sb-url-input').value = url;
            localStorage.setItem(SUPABASE_CFG_KEY, JSON.stringify({ url, key }));
            await initSupabaseFromStorage();
            const ok = await pushStateToSupabase();
            if (ok) {
                showToast('Połączono z bazą Supabase i zsynchronizowano dane!', 'success');
            } else {
                showToast('Klucze działają! Teraz wklej i uruchom kod SQL w zakładce SQL Editor w Supabase.', 'info');
            }
        }

        function copySqlToClipboard() {
            const text = document.getElementById('sql-code-block').innerText;
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            showToast('Skopiowano kod SQL do schowka!', 'success');
        }

        // Start aplikacji po załadowaniu okna
        window.onload = function () {
            renderQuickLoginButtons();
            initSupabaseFromStorage();
        };
    </script>
</body>
</html>
