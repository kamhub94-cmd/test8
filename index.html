    <script>
        /********************************************************************

         ********************************************************************/
        const STORAGE_KEY = 'fifa_arena_pro_state_v3_clean';
        const SUPABASE_CFG_KEY = 'fifa_arena_supabase_cfg';

        // Twoje dane Supabase wbudowane na stałe w kodzie:
        const DEFAULT_SUPABASE_URL = 'https://syyoaublyzmprxfghwrq.supabase.co';
        const DEFAULT_SUPABASE_KEY = 'sb_publishable_W9tJbiw2aK5e8QTrKys0Aw_FA1dXpPs';

        // Funkcja automatycznie oczyszczająca URL (np. gdy wklejono końcówkę /rest/v1/)
        function cleanSupabaseUrl(rawUrl) {
            if (!rawUrl) return DEFAULT_SUPABASE_URL;
            return rawUrl
                .trim()
                .replace(/\/rest\/v1\/?$/i, '')
                .replace(/\/+$/, '');
        }

        let supabaseClient = null;
        let supabasePollTimer = null;
        let lastSyncedSignature = '';
        let currentUser = null;
        let currentMainTab = 'tournaments';

        let selectedTournamentId = null;
        let selectedStatsPlayerId = null;
        let betSlip = []; // Kupon gracza (SOLO / COMBI)

        function ensureStateIntegrity(st) {
            if (!st || typeof st !== 'object') return getInitialState();
            if (!st.stateVersion) st.stateVersion = 3;
            if (!st.config) st.config = {};
            if (st.config.oddsMargin === undefined) st.config.oddsMargin = 0.94;
            if (st.config.matchWinnerTaxPct === undefined) st.config.matchWinnerTaxPct = 4;
            if (st.config.tournamentWinnerTaxPct === undefined) st.config.tournamentWinnerTaxPct = 1;
            if (st.config.eloKFactor === undefined) st.config.eloKFactor = 32;
            if (st.config.eloGainPct === undefined) st.config.eloGainPct = 100;
            if (st.config.eloLossPct === undefined) st.config.eloLossPct = 100;
            if (st.config.globalBettingLocked === undefined) st.config.globalBettingLocked = false;
            if (st.config.ownMatchBetRule === undefined) st.config.ownMatchBetRule = 'allow_all';

            if (!Array.isArray(st.users)) st.users = [];
            st.users.forEach(u => {
                if (u.currentTourneyStreak === undefined) u.currentTourneyStreak = 0;
                if (u.bestTourneyStreak === undefined) u.bestTourneyStreak = u.trophies > 0 ? 1 : 0;
                if (u.statsResetAt === undefined) u.statsResetAt = 0;
            });

            if (!Array.isArray(st.tournaments)) st.tournaments = [];
            st.tournaments.forEach(t => {
                if (!Array.isArray(t.byes)) t.byes = [];
            });

            if (!Array.isArray(st.historicalMatches)) st.historicalMatches = [];
            if (!Array.isArray(st.bets)) st.bets = [];
            if (!Array.isArray(st.transfers)) st.transfers = [];
            if (!Array.isArray(st.balanceLogs)) st.balanceLogs = [];
            if (!Array.isArray(st.adminLogs)) st.adminLogs = [];
            return st;
        }

        let appState = loadState();

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && Array.isArray(parsed.users) && parsed.users.length > 0 && Array.isArray(parsed.tournaments)) {
                        return ensureStateIntegrity(parsed);
                    }
                }
            } catch (e) {
                console.error('Błąd odczytu stanu:', e);
            }
            const initial = ensureStateIntegrity(getInitialState());
            localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
            return initial;
        }

        // Funkcje rejestrujące historię zmian salda oraz historię działań w panelu admina
        function logBalanceChange(userId, delta, oldBalance, newBalance, category, description) {
            if (!Array.isArray(appState.balanceLogs)) appState.balanceLogs = [];
            const u = getUserById(userId);
            appState.balanceLogs.unshift({
                id: 'bl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                date: nowStr(),
                userId,
                userName: u ? u.name : 'Gracz',
                delta: Math.round(delta),
                oldBalance: Math.round(oldBalance),
                newBalance: Math.round(newBalance),
                category,
                description
            });
            if (appState.balanceLogs.length > 300) appState.balanceLogs.length = 300;
        }

        function logAdminAction(category, description) {
            if (!Array.isArray(appState.adminLogs)) appState.adminLogs = [];
            appState.adminLogs.unshift({
                id: 'al_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                date: nowStr(),
                adminName: currentUser ? currentUser.name : 'Admin',
                category,
                description
            });
            if (appState.adminLogs.length > 300) appState.adminLogs.length = 300;
        }

        async function saveState(syncCloud = true) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                if (currentUser) {
                    const freshUser = appState.users.find(u => u.id === currentUser.id);
                    if (freshUser) currentUser = freshUser;
                    updateHeaderUserUI();
                }
                if (syncCloud && supabaseClient) {
                    await pushStateToSupabase();
                }
            } catch (e) {
                console.error('Błąd zapisu stanu:', e);
            }
        }

        /********************************************************************
         * 2. INTEGRACJA Z SUPABASE (SYNCHRONIZACJA W CHMURZE DLA ZNAJOMYCH)
         ********************************************************************/
        function setCloudStatusUI(text, statusType = 'ok') {
            const badge = document.getElementById('cloud-status-badge');
            const headerPill = document.getElementById('header-cloud-pill');
            const styles = {
                ok: 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30',
                warn: 'bg-amber-500/20 text-amber-300 border border-amber-500/30',
                err: 'bg-rose-500/20 text-rose-400 border border-rose-500/30'
            };
            if (badge) {
                badge.textContent = text;
                badge.className = `text-[11px] px-2.5 py-0.5 rounded-full font-semibold ${styles[statusType] || styles.ok}`;
            }
            if (headerPill) {
                headerPill.innerHTML = `<i class="fa-solid fa-cloud mr-1"></i>${text}`;
                headerPill.className = `text-[10px] font-bold px-2 py-0.5 rounded-full ${styles[statusType] || styles.ok}`;
            }
        }

        function getActiveSupabaseConfig() {
            try {
                const rawCfg = localStorage.getItem(SUPABASE_CFG_KEY);
                if (rawCfg) {
                    const parsed = JSON.parse(rawCfg);
                    if (parsed.url && parsed.key) {
                        return {
                            url: cleanSupabaseUrl(parsed.url),
                            key: parsed.key.trim()
                        };
                    }
                }
            } catch (e) {
                console.warn('Błąd odczytu konfiguracji Supabase z localStorage:', e);
            }
            return {
                url: cleanSupabaseUrl(DEFAULT_SUPABASE_URL),
                key: DEFAULT_SUPABASE_KEY
            };
        }

        async function initSupabaseFromStorage() {
            try {
                const cfg = getActiveSupabaseConfig();
                localStorage.setItem(SUPABASE_CFG_KEY, JSON.stringify(cfg));

                if (cfg.url && cfg.key && window.supabase) {
                    supabaseClient = window.supabase.createClient(cfg.url, cfg.key, {
                        auth: { persistSession: false }
                    });
                    await pullStateFromSupabase(true);

                    // Bezpieczna synchronizacja przez HTTPS REST (co 4 sekundy) bez używania WebSocket (wss://),
                    // dzięki czemu podgląd Canvas oraz strona na Netlify działają bez błędów SecurityError
                    if (supabasePollTimer) clearInterval(supabasePollTimer);
                    supabasePollTimer = setInterval(() => {
                        const activeTag = document.activeElement ? document.activeElement.tagName : '';
                        if (activeTag !== 'INPUT' && activeTag !== 'SELECT' && activeTag !== 'TEXTAREA') {
                            pullStateFromSupabase(false);
                        }
                    }, 4000);
                }
            } catch (err) {
                console.warn('Błąd połączenia z Supabase:', err);
                setCloudStatusUI('Tryb Lokalny (Sprawdź połączenie)', 'warn');
            }
        }

        async function pullStateFromSupabase(forceRender = false) {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('fifa_app_state')
                    .select('data')
                    .eq('id', 1)
                    .single();

                if (!error && data && data.data && Array.isArray(data.data.users)) {
                    // Jeśli w chmurze Supabase jest jeszcze stara wersja demo (bez stateVersion >= 3),
                    // automatycznie nadpisz ją czystym stanem startowym ze zresetowanymi statystykami
                    if (!data.data.stateVersion || data.data.stateVersion < 3) {
                        appState = getInitialState();
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                        await pushStateToSupabase();
                        if (currentUser) renderAll();
                        return;
                    }
                    const incomingSig = JSON.stringify(data.data);
                    setCloudStatusUI('Chmura Supabase: Połączono (LIVE)', 'ok');
                    if (forceRender || incomingSig !== lastSyncedSignature) {
                        lastSyncedSignature = incomingSig;
                        appState = ensureStateIntegrity(data.data);
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                        if (currentUser) renderAll();
                    }
                } else if (error && error.code === 'PGRST116') {
                    // Tabela istnieje, ale nie ma jeszcze pierwszego rekordu id=1 -> inicjalizujemy bazę!
                    await pushStateToSupabase();
                    setCloudStatusUI('Chmura Supabase: Zainicjowano (LIVE)', 'ok');
                } else if (error) {
                    console.warn('Info z Supabase (prawdopodobnie brak tabeli SQL):', error.message);
                    setCloudStatusUI('Supabase: Uruchom skrypt SQL w panelu!', 'warn');
                }
            } catch (e) {
                console.warn('Błąd pobierania danych z Supabase:', e);
            }
        }

        async function pushStateToSupabase() {
            if (!supabaseClient) return false;
            try {
                lastSyncedSignature = JSON.stringify(appState);
                const { error } = await supabaseClient
                    .from('fifa_app_state')
                    .upsert({ id: 1, data: appState, updated_at: new Date().toISOString() });

                if (error) {
                    console.warn('Nie udało się zapisać do tabeli fifa_app_state:', error.message);
                    setCloudStatusUI('Supabase: Utwórz tabelę SQL!', 'warn');
                    return false;
                }
                setCloudStatusUI('Chmura Supabase: Połączono (LIVE)', 'ok');
                return true;
            } catch (e) {
                console.warn('Błąd wysyłania stanu do Supabase:', e);
                return false;
            }
        }

        /********************************************************************
         * 5. STATYSTYKI GRACZY I SILNIK KURSÓW (ELO + HISTORIA BRAMEK + H2H)
         ********************************************************************/
        function computePlayerFullStats(userId) {
            const u = getUserById(userId);
            const resetTimestamp = Number(u.statsResetAt) || 0;
            let played = u.seedMatches || 0;
            let wins = u.seedWins || 0;
            let draws = u.seedDraws || 0;
            let losses = u.seedLosses || 0;
            let goalsFor = u.seedGoalsFor || 0;
            let goalsAgainst = u.seedGoalsAgainst || 0;

            const matchHistory = [];
            const h2hMap = {}; // Statystyki bezpośrednie z każdym przeciwnikiem

            const recordH2H = (oppId, myG, oppG) => {
                if (!oppId || oppId === userId) return;
                if (!h2hMap[oppId]) {
                    h2hMap[oppId] = {
                        oppId,
                        oppName: getUserById(oppId).name,
                        total: 0,
                        wins: 0,
                        draws: 0,
                        losses: 0,
                        gf: 0,
                        ga: 0
                    };
                }
                const rec = h2hMap[oppId];
                rec.total++;
                rec.gf += myG;
                rec.ga += oppG;
                if (myG > oppG) rec.wins++;
                else if (myG === oppG) rec.draws++;
                else rec.losses++;
            };

            appState.tournaments.forEach(t => {
                if (t.status === 'cancelled') return;
                t.matches.forEach(m => {
                    if (m.status === 'finished' && m.homeScore !== null && m.awayScore !== null) {
                        if (resetTimestamp > 0 && (m.finishedAt || 0) <= resetTimestamp) return;
                        if (m.homeId === userId || m.awayId === userId) {
                            const isHome = m.homeId === userId;
                            const myGoals = isHome ? Number(m.homeScore) : Number(m.awayScore);
                            const oppGoals = isHome ? Number(m.awayScore) : Number(m.homeScore);
                            const oppId = isHome ? m.awayId : m.homeId;

                            played++;
                            goalsFor += myGoals;
                            goalsAgainst += oppGoals;
                            if (myGoals > oppGoals) wins++;
                            else if (myGoals === oppGoals) draws++;
                            else losses++;

                            recordH2H(oppId, myGoals, oppGoals);

                            matchHistory.push({
                                id: m.id,
                                date: t.createdAt,
                                tournamentName: t.name,
                                stageLabel: m.stageLabel || `Kolejka ${m.round}`,
                                opponentName: getUserById(oppId).name,
                                myGoals,
                                oppGoals,
                                result: myGoals > oppGoals ? 'W' : (myGoals === oppGoals ? 'D' : 'L')
                            });
                        }
                    }
                });
            });

            appState.historicalMatches.forEach(hm => {
                if (resetTimestamp > 0 && (hm.createdAtMs || 0) <= resetTimestamp) return;
                if (hm.homeId === userId || hm.awayId === userId) {
                    const isHome = hm.homeId === userId;
                    const myGoals = isHome ? Number(hm.homeScore) : Number(hm.awayScore);
                    const oppGoals = isHome ? Number(hm.awayScore) : Number(hm.homeScore);
                    const oppId = isHome ? hm.awayId : hm.homeId;

                    recordH2H(oppId, myGoals, oppGoals);

                    matchHistory.push({
                        id: hm.id,
                        date: hm.date,
                        tournamentName: hm.tournamentName || 'Mecz Historyczny',
                        stageLabel: 'Archiwum',
                        opponentName: getUserById(oppId).name,
                        myGoals,
                        oppGoals,
                        result: myGoals > oppGoals ? 'W' : (myGoals === oppGoals ? 'D' : 'L')
                    });
                }
            });

            // Obliczanie Ulubionego i Pechowego przeciwnika (tylko rywale, z którymi rozegrano minimum 5 meczów!)
            const qualifiedH2H = Object.values(h2hMap).filter(r => r.total >= 5);
            let favoriteOpponent = null;
            let unluckyOpponent = null;

            if (qualifiedH2H.length > 0) {
                const sortedFav = [...qualifiedH2H].sort((a, b) => {
                    const wrA = a.wins / a.total;
                    const wrB = b.wins / b.total;
                    if (wrB !== wrA) return wrB - wrA;
                    if (b.wins !== a.wins) return b.wins - a.wins;
                    return (b.gf - b.ga) - (a.gf - a.ga);
                });
                if (sortedFav[0].wins > 0) {
                    favoriteOpponent = {
                        ...sortedFav[0],
                        winRatePct: Math.round((sortedFav[0].wins / sortedFav[0].total) * 100)
                    };
                }

                const sortedUnlucky = [...qualifiedH2H].sort((a, b) => {
                    const lrA = a.losses / a.total;
                    const lrB = b.losses / b.total;
                    if (lrB !== lrA) return lrB - lrA;
                    if (b.losses !== a.losses) return b.losses - a.losses;
                    return (a.gf - a.ga) - (b.gf - b.ga);
                });
                if (sortedUnlucky[0].losses > 0) {
                    unluckyOpponent = {
                        ...sortedUnlucky[0],
                        lossRatePct: Math.round((sortedUnlucky[0].losses / sortedUnlucky[0].total) * 100)
                    };
                }
            }

            const avgScored = played > 0 ? (goalsFor / played) : 2.3;
            const avgConceded = played > 0 ? (goalsAgainst / played) : 2.1;
            const winRate = played > 0 ? Math.round((wins / played) * 100) : 0;

            return {
                user: u,
                played,
                wins,
                draws,
                losses,
                goalsFor,
                goalsAgainst,
                avgScored,
                avgConceded,
                winRate,
                trophies: u.trophies || 0,
                currentTourneyStreak: u.currentTourneyStreak || 0,
                bestTourneyStreak: u.bestTourneyStreak || 0,
                currentStreak: u.currentStreak || 0,
                bestStreak: u.bestStreak || 0,
                favoriteOpponent,
                unluckyOpponent,
                matchHistory: matchHistory.reverse()
            };
        }

        function poissonOverProb(lambda, k) {
            let sum = 0;
            let fact = 1;
            for (let i = 0; i <= k; i++) {
                if (i > 0) fact *= i;
                sum += (Math.pow(lambda, i) * Math.exp(-lambda)) / fact;
            }
            return Math.max(0.03, Math.min(0.95, 1 - sum));
        }

        function probToOdd(prob) {
            const margin = Number(appState.config.oddsMargin) || 0.94;
            const raw = (1 / Math.max(0.03, Math.min(0.96, prob))) * margin;
            return Number(Math.max(1.08, Math.min(28.0, raw)).toFixed(2));
        }

        function calculateMatchOdds(homeId, awayId) {
            const homeStats = computePlayerFullStats(homeId);
            const awayStats = computePlayerFullStats(awayId);
            const eloA = homeStats.user.elo || 1200;
            const eloB = awayStats.user.elo || 1200;

            const expA = 1 / (1 + Math.pow(10, (eloB - eloA) / 400));
            const drawProb = 0.21 * Math.exp(-Math.abs(eloA - eloB) / 340);
            const p1 = expA * (1 - drawProb);
            const p2 = (1 - expA) * (1 - drawProb);

            const eloRatioA = Math.pow(eloA / Math.max(600, eloB), 0.55);
            const eloRatioB = Math.pow(eloB / Math.max(600, eloA), 0.55);

            const lambdaA = Math.max(0.7, Math.min(5.2, ((homeStats.avgScored + awayStats.avgConceded) / 2) * eloRatioA));
            const lambdaB = Math.max(0.7, Math.min(5.2, ((awayStats.avgScored + homeStats.avgConceded) / 2) * eloRatioB));
            const lambdaTotal = lambdaA + lambdaB;

            const playerHomeGoals = {};
            const playerAwayGoals = {};
            [1, 2, 3, 4, 5].forEach(k => {
                playerHomeGoals[`over_${k}`] = probToOdd(poissonOverProb(lambdaA, k));
                playerAwayGoals[`over_${k}`] = probToOdd(poissonOverProb(lambdaB, k));
            });

            const totalGoals = {};
            [2, 3, 4, 5, 6].forEach(k => {
                const overP = poissonOverProb(lambdaTotal, k);
                totalGoals[`over_${k}`] = probToOdd(overP);
                totalGoals[`under_${k}`] = probToOdd(1 - overP);
            });

            return {
                m1x2: {
                    '1': probToOdd(p1),
                    'X': probToOdd(drawProb),
                    '2': probToOdd(p2)
                },
                lambdaA: lambdaA.toFixed(2),
                lambdaB: lambdaB.toFixed(2),
                totalGoals,
                playerHomeGoals,
                playerAwayGoals
            };
        }

        function calculateOutrightTournamentOdds(tournament) {
            const players = tournament.playerIds.map(id => getUserById(id));
            if (players.length === 0) return {};
            const weights = players.map(p => Math.pow(10, (p.elo || 1200) / 360));
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            const result = {};
            players.forEach((p, idx) => {
                const prob = weights[idx] / totalWeight;
                result[p.id] = probToOdd(prob);
            });
            return result;
        }

        /********************************************************************
         * 6. LOGIKA TABEL, SYSTEMU SZWAJCARSKIEGO, PUCHARU ELO I FAZ FINAŁOWYCH
         ********************************************************************/
        function computeTournamentStandings(tournament, stageFilter = 'regular') {
            const table = {};
            tournament.playerIds.forEach(pid => {
                const u = getUserById(pid);
                table[pid] = {
                    id: pid,
                    name: u.name,
                    elo: u.elo,
                    played: 0,
                    wins: 0,
                    draws: 0,
                    losses: 0,
                    gf: 0,
                    ga: 0,
                    gd: 0,
                    pts: 0,
                    opponents: []
                };
            });

            tournament.matches.forEach(m => {
                if (stageFilter && m.stage !== stageFilter) return;
                if (m.status === 'cancelled') return;

                if (table[m.homeId] && table[m.awayId]) {
                    table[m.homeId].opponents.push(m.awayId);
                    table[m.awayId].opponents.push(m.homeId);
                }

                if (m.status === 'finished' && m.homeScore !== null && m.awayScore !== null) {
                    const hs = Number(m.homeScore);
                    const as = Number(m.awayScore);
                    const h = table[m.homeId];
                    const a = table[m.awayId];
                    if (!h || !a) return;

                    h.played++; a.played++;
                    h.gf += hs; h.ga += as; h.gd = h.gf - h.ga;
                    a.gf += as; a.ga += hs; a.gd = a.gf - a.ga;

                    if (hs > as) {
                        h.wins++; h.pts += 3;
                        a.losses++;
                    } else if (hs < as) {
                        a.wins++; a.pts += 3;
                        h.losses++;
                    } else {
                        h.draws++; h.pts += 1;
                        a.draws++; a.pts += 1;
                    }
                }
            });

            return Object.values(table).sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.gd !== a.gd) return b.gd - a.gd;
                if (b.gf !== a.gf) return b.gf - a.gf;
                return b.elo - a.elo;
            });
        }

        function havePlayedInRegular(tournament, p1, p2) {
            return tournament.matches.some(m =>
                m.stage === 'regular' &&
                m.status !== 'cancelled' &&
                ((m.homeId === p1 && m.awayId === p2) || (m.homeId === p2 && m.awayId === p1))
            );
        }

        // System Szwajcarski:
        // Gdy liczba graczy jest nieparzysta:
        // - W 1. kolejce pauzuje gracz z NAJNIŻSZYM ELO, a pozostali są dobierani Najwyższe ELO vs Najniższe ELO.
        // - W kolejnych kolejkach pauzuje najniżej sklasyfikowany gracz w tabeli (który jeszcze nie pauzował), a reszta gra Równy z Równym.
        function generateSwissRoundMatches(tournament, roundNumber) {
            if (!Array.isArray(tournament.byes)) tournament.byes = [];
            // Usuń ewentualny wcześniejszy wpis pauzy dla tej samej kolejki
            tournament.byes = tournament.byes.filter(b => b.round !== roundNumber);

            const pairings = [];
            if (roundNumber === 1) {
                const sortedByElo = [...tournament.playerIds]
                    .map(id => getUserById(id))
                    .sort((a, b) => b.elo - a.elo);

                let activePlayers = [...sortedByElo];
                if (activePlayers.length % 2 !== 0) {
                    // Pauzuje osoba z najniższym ELO
                    const pausingPlayer = activePlayers.pop();
                    tournament.byes.push({
                        round: 1,
                        playerId: pausingPlayer.id,
                        reason: 'Najniższe ELO w 1. kolejce (nieparzysta liczba graczy)'
                    });
                }

                const n = activePlayers.length;
                const half = Math.floor(n / 2);
                for (let i = 0; i < half; i++) {
                    pairings.push({
                        homeId: activePlayers[i].id,
                        awayId: activePlayers[n - 1 - i].id,
                        stageLabel: `Kolejka Szwajcarska 1 (Najwyższe ELO vs Najniższe ELO)`
                    });
                }
            } else {
                const standings = computeTournamentStandings(tournament, 'regular');
                let ids = standings.map(s => s.id);
                if (ids.length % 2 !== 0) {
                    // Wybierz do pauzy osobę z dołu tabeli, która jeszcze nie pauzowała
                    const alreadyPausedIds = tournament.byes.map(b => b.playerId);
                    let pauseIdx = ids.length - 1;
                    for (let i = ids.length - 1; i >= 0; i--) {
                        if (!alreadyPausedIds.includes(ids[i])) {
                            pauseIdx = i;
                            break;
                        }
                    }
                    const [pausedId] = ids.splice(pauseIdx, 1);
                    tournament.byes.push({
                        round: roundNumber,
                        playerId: pausedId,
                        reason: `Pauza w Kolejce ${roundNumber} (nieparzysta liczba graczy)`
                    });
                }

                function findDisjointPairs(remaining) {
                    if (remaining.length === 0) return [];
                    const first = remaining[0];
                    for (let i = 1; i < remaining.length; i++) {
                        const candidate = remaining[i];
                        if (!havePlayedInRegular(tournament, first, candidate)) {
                            const nextRem = remaining.filter((_, idx) => idx !== 0 && idx !== i);
                            const subResult = findDisjointPairs(nextRem);
                            if (subResult !== null) {
                                return [[first, candidate], ...subResult];
                            }
                        }
                    }
                    return null;
                }

                let foundPairs = findDisjointPairs(ids);
                if (!foundPairs) {
                    foundPairs = [];
                    for (let i = 0; i < ids.length; i += 2) {
                        if (ids[i + 1]) foundPairs.push([ids[i], ids[i + 1]]);
                    }
                }

                foundPairs.forEach(pair => {
                    pairings.push({
                        homeId: pair[0],
                        awayId: pair[1],
                        stageLabel: `Kolejka Szwajcarska ${roundNumber} (Równy z Równym wg Tabeli)`
                    });
                });
            }

            return pairings.map((p, idx) => ({
                id: `m_${tournament.id}_r${roundNumber}_${Date.now()}_${idx}`,
                tournamentId: tournament.id,
                round: roundNumber,
                stage: 'regular',
                stageLabel: p.stageLabel,
                homeId: p.homeId,
                awayId: p.awayId,
                homeScore: null,
                awayScore: null,
                status: 'scheduled',
                matchTaxPool: 0,
                bettingOpen: tournament.bettingMode === 'matches' || tournament.bettingMode === 'both',
                markets: { m1x2: true, totalGoals: true, playerGoals: true }
            }));
        }

        function startPlayoffPhase(tournamentId) {
            const t = appState.tournaments.find(x => x.id === tournamentId);
            if (!t) return;

            const unfinishedRegular = t.matches.filter(m => m.stage === 'regular' && m.status === 'scheduled');

                showToast('Najpierw wpisz wyniki wszystkich meczów aktualnej fazy zasadniczej!', 'error');
                return;
            }

            const standings = computeTournamentStandings(t, 'regular');
            if (standings.length < 2) {
                showToast('Za mało graczy do utworzenia fazy finałowej.', 'error');
                return;
            }

            t.phase = 'playoffs';
            const now = Date.now();
            const openBet = t.bettingMode === 'matches' || t.bettingMode === 'both';
            const advCount = Number(t.advancingCount) || 4;

            // Naprawa Bezpośredniego Finału (gdy wybrano TOP 2 lub jest mniej niż 4 graczy)

                t.matches.push({

                    tournamentId: t.id,

                    stage: 'playoff_final',
                    stageLabel: 'WIELKI FINAŁ TURNIEJU (Bezpośredni Finał: 1. vs 2. miejsce)',
                    homeId: standings[0].id,
                    awayId: standings[1].id,
                    homeScore: null,
                    awayScore: null,
                    status: 'scheduled',
                    matchTaxPool: 0,

                });
                showToast(`Wygenerowano Bezpośredni Wielki Finał: ${standings[0].name} vs ${standings[1].name}!`, 'success');

            } else {

                    },
                    {

                    }
                );

        function checkAndAdvancePlayoffs(tournament) {
            const openBet = tournament.bettingMode === 'matches' || tournament.bettingMode === 'both';
            const getWinnerLoser = (m) => {
                if (!m || m.status !== 'finished') return null;
                const hs = Number(m.homeScore);
                const as = Number(m.awayScore);
                if (hs === as) return null;
                return hs > as
                    ? { winner: m.homeId, loser: m.awayId }
                    : { winner: m.awayId, loser: m.homeId };
            };

            const ubSemi = tournament.matches.find(m => m.stage === 'playoff_ub_semi' && m.status !== 'cancelled');
            const lbSemi = tournament.matches.find(m => m.stage === 'playoff_lb_semi' && m.status !== 'cancelled');
            const lbFinal = tournament.matches.find(m => m.stage === 'playoff_lb_final' && m.status !== 'cancelled');
            const grandFinal = tournament.matches.find(m => m.stage === 'playoff_final' && m.status !== 'cancelled');

            if (ubSemi && lbSemi && !lbFinal) {
                const ubRes = getWinnerLoser(ubSemi);
                const lbRes = getWinnerLoser(lbSemi);
                if (ubRes && lbRes) {
                    tournament.matches.push({
                        id: `m_${tournament.id}_lbfinal_${Date.now()}`,
                        tournamentId: tournament.id,
                        round: 95,
                        stage: 'playoff_lb_final',
                        stageLabel: 'Finał Dolnej Drabinki (Przegrany 1v2 vs Zwycięzca 3v4 o wejście do Finału)',
                        homeId: ubRes.loser,
                        awayId: lbRes.winner,
                        homeScore: null,
                        awayScore: null,
                        status: 'scheduled',
                        matchTaxPool: 0,
                        bettingOpen: openBet,
                        markets: { m1x2: true, totalGoals: true, playerGoals: true }
                    });
                    showToast('Utworzono Finał Dolnej Drabinki o wejście do Wielkiego Finału!', 'info');
                }
            }

            if (ubSemi && lbFinal && !grandFinal) {
                const ubRes = getWinnerLoser(ubSemi);
                const lbFinalRes = getWinnerLoser(lbFinal);
                if (ubRes && lbFinalRes) {
                    tournament.matches.push({
                        id: `m_${tournament.id}_grandfinal_${Date.now()}`,
                        tournamentId: tournament.id,
                        round: 99,
                        stage: 'playoff_final',
                        stageLabel: 'WIELKI FINAŁ TURNIEJU',
                        homeId: ubRes.winner,
                        awayId: lbFinalRes.winner,
                        homeScore: null,
                        awayScore: null,
                        status: 'scheduled',
                        matchTaxPool: 0,
                        bettingOpen: openBet,
                        markets: { m1x2: true, totalGoals: true, playerGoals: true }
                    });
                    showToast('Wielki Finał został zestawiony!', 'success');
                }
            }

            const sf1 = tournament.matches.find(m => m.stage === 'playoff_sf1' && m.status !== 'cancelled');
            const sf2 = tournament.matches.find(m => m.stage === 'playoff_sf2' && m.status !== 'cancelled');
            if (sf1 && sf2 && !grandFinal) {
                const r1 = getWinnerLoser(sf1);
                const r2 = getWinnerLoser(sf2);
                if (r1 && r2) {
                    tournament.matches.push({
                        id: `m_${tournament.id}_grandfinal_${Date.now()}`,
                        tournamentId: tournament.id,
                        round: 99,
                        stage: 'playoff_final',
                        stageLabel: 'WIELKI FINAŁ TURNIEJU',
                        homeId: r1.winner,
                        awayId: r2.winner,
                        homeScore: null,
                        awayScore: null,
                        status: 'scheduled',
                        matchTaxPool: 0,
                        bettingOpen: openBet,
                        markets: { m1x2: true, totalGoals: true, playerGoals: true }
                    });
                    showToast('Zwycięzcy półfinałów awansowali do Wielkiego Finału!', 'success');
                }
            }

            const finalMatch = tournament.matches.find(m => m.stage === 'playoff_final' && m.status === 'finished');
            if (finalMatch && tournament.status !== 'completed') {
                const res = getWinnerLoser(finalMatch);
                if (res) {
                    crownTournamentChampion(tournament, res.winner);
                }
            }
        }

        function crownTournamentChampion(tournament, championUserId) {
            tournament.status = 'completed';
            tournament.phase = 'completed';
            tournament.winnerId = championUserId;

            const champ = getUserById(championUserId);
            champ.trophies = (champ.trophies || 0) + 1;

            // Aktualizacja passy wygranych turniejów z rzędu
            appState.users.forEach(u => {
                if (u.id === championUserId) {
                    u.currentTourneyStreak = (u.currentTourneyStreak || 0) + 1;
                    if (u.currentTourneyStreak > (u.bestTourneyStreak || 0)) {
                        u.bestTourneyStreak = u.currentTourneyStreak;
                    }
                } else if (tournament.playerIds.includes(u.id)) {
                    u.currentTourneyStreak = 0;
                }
            });

            const jackpot = Math.round(tournament.jackpotPool || 0);
            if (jackpot > 0) {
                const oldPts = champ.points || 0;
                champ.points = Math.round(oldPts + jackpot);
                logBalanceChange(
                    champ.id,
                    jackpot,
                    oldPts,
                    champ.points,
                    'Nagroda Turniejowa',
                    `Zwycięstwo w turnieju "${tournament.name}" (pula ${appState.config.tournamentWinnerTaxPct}%)`
                );
            }

            settleOutrightBets(tournament.id, championUserId);

            showToast(`🏆 Turniej zakończony! Mistrzem zostaje ${champ.name} (+${jackpot} pkt z puli ${appState.config.tournamentWinnerTaxPct}%)!`, 'success');
        }

        /********************************************************************
         * 7. ROZLICZANIE MECZÓW, PUNKTÓW ELO, PODATKÓW I KUPONÓW
         ********************************************************************/
        function evaluateSelectionHit(sel, match, tournament) {
            if (sel.kind === 'outright') {
                if (tournament.status !== 'completed' || !tournament.winnerId) return null;
                return sel.pickedWinnerId === tournament.winnerId;
            }
            if (!match || match.status !== 'finished' || match.homeScore === null || match.awayScore === null) {
                return null;
            }
            const hs = Number(match.homeScore);
            const as = Number(match.awayScore);
            const total = hs + as;
            const code = sel.code;

            if (code === '1X2_1') return hs > as;
            if (code === '1X2_X') return hs === as;
            if (code === '1X2_2') return hs < as;

            if (code.startsWith('TOT_OVER_')) {
                const line = Number(code.replace('TOT_OVER_', ''));
                return total > line;
            }
            if (code.startsWith('TOT_UNDER_')) {
                const line = Number(code.replace('TOT_UNDER_', ''));
                return total <= line;
            }
            if (code.startsWith('HOME_OVER_')) {
                const line = Number(code.replace('HOME_OVER_', ''));
                return hs > line;
            }
            if (code.startsWith('AWAY_OVER_')) {
                const line = Number(code.replace('AWAY_OVER_', ''));
                return as > line;
            }
            return false;
        }

        function reevaluateAllPendingBets() {
            appState.bets.forEach(bet => {
                if (bet.status !== 'pending') return;

                let allResolved = true;
                let anyLost = false;

                bet.selections.forEach(sel => {
                    const t = appState.tournaments.find(x => x.id === sel.tournamentId);
                    if (!t) { allResolved = false; return; }
                    const m = sel.matchId ? t.matches.find(x => x.id === sel.matchId) : null;
                    const hit = evaluateSelectionHit(sel, m, t);
                    if (hit === null) {
                        allResolved = false;
                    } else if (hit === false) {
                        anyLost = true;
                    }
                });

                if (anyLost) {
                    bet.status = 'lost';
                } else if (allResolved && !anyLost) {
                    bet.status = 'won';
                    const bettor = getUserById(bet.userId);
                    const oldPts = bettor.points || 0;
                    const winPts = Math.round(Number(bet.potentialWin));
                    bettor.points = Math.round(oldPts + winPts);

                    // Rozdzielenie dwóch podatków od WYPŁATY wygranej:
                    // 1) Podatek na zwycięzcę meczu od wypłaty (payoutMatchTax)
                    const payoutMatchTax = Math.round(Number(bet.payoutMatchTax || 0));
                    if (payoutMatchTax > 0) {
                        const matchSels = bet.selections.filter(s => s.kind === 'match');
                        if (matchSels.length > 0) {
                            const perMatchTax = payoutMatchTax / matchSels.length;
                            matchSels.forEach(s => {
                                const t = appState.tournaments.find(x => x.id === s.tournamentId);
                                const m = t ? t.matches.find(x => x.id === s.matchId) : null;
                                if (m && m.status === 'finished') {
                                    m.matchTaxPool = (m.matchTaxPool || 0) + perMatchTax;
                                    const hs = Number(m.homeScore);
                                    const as = Number(m.awayScore);
                                    const bonus = Math.round(perMatchTax);
                                    if (bonus > 0) {
                                        if (hs > as) {
                                            const hu = getUserById(m.homeId);
                                            const hOld = hu.points || 0;
                                            hu.points = Math.round(hOld + bonus);
                                            logBalanceChange(hu.id, bonus, hOld, hu.points, 'Podatek Meczowy (z wypłaty kuponu)', `Premia ${appState.config.matchWinnerTaxPct}% od wygranego kuponu gracza ${bettor.name}`);
                                        } else if (as > hs) {
                                            const au = getUserById(m.awayId);
                                            const aOld = au.points || 0;
                                            au.points = Math.round(aOld + bonus);
                                            logBalanceChange(au.id, bonus, aOld, au.points, 'Podatek Meczowy (z wypłaty kuponu)', `Premia ${appState.config.matchWinnerTaxPct}% od wygranego kuponu gracza ${bettor.name}`);
                                        } else if (t) {
                                            t.jackpotPool = Math.round((t.jackpotPool || 0) + bonus);
                                        }
                                    }
                                }
                            });
                        }
                    }

                    // 2) Podatek do puli turnieju od wypłaty (payoutTourneyTax)
                    const payoutTourneyTax = Math.round(Number(bet.payoutTourneyTax || 0));
                    if (payoutTourneyTax > 0 && bet.selections.length > 0) {
                        const perSelTourneyTax = payoutTourneyTax / bet.selections.length;
                        bet.selections.forEach(s => {
                            const t = appState.tournaments.find(x => x.id === s.tournamentId);
                            if (t) {
                                const bonus = Math.round(perSelTourneyTax);
                                t.jackpotPool = Math.round((t.jackpotPool || 0) + bonus);
                                // Jeśli turniej właśnie się zakończył i ma już mistrza, dopisz podatek bezpośrednio mistrzowi
                                if (t.status === 'completed' && t.winnerId && bonus > 0) {
                                    const champ = getUserById(t.winnerId);
                                    const cOld = champ.points || 0;
                                    champ.points = Math.round(cOld + bonus);
                                    logBalanceChange(champ.id, bonus, cOld, champ.points, 'Podatek Turniejowy (z wypłaty kuponu)', `Dopłata ${appState.config.tournamentWinnerTaxPct}% z wygranego kuponu w turnieju "${t.name}"`);
                                }
                            }
                        });
                    }

                    logBalanceChange(
                        bettor.id,
                        winPts,
                        oldPts,
                        bettor.points,
                        'Wygrana na Bukmacherce',
                        `Wygrany kupon ${bet.type} (Kurs: ${bet.totalOdds}, Stawka: ${bet.stake} pkt, Wypłata netto: ${winPts} pkt)`
                    );
                    showToast(`Kupon gracza ${bettor.name} trafiony! Wygrana netto: +${winPts} pkt`, 'success');
                }
            });
        }

        function settleOutrightBets(tournamentId, winnerUserId) {
            reevaluateAllPendingBets();
        }

        function submitMatchScore(tournamentId, matchId, homeScoreVal, awayScoreVal) {
            const t = appState.tournaments.find(x => x.id === tournamentId);
            if (!t) return;
            const m = t.matches.find(x => x.id === matchId);
            if (!m) return;

            const hs = parseInt(homeScoreVal, 10);
            const as = parseInt(awayScoreVal, 10);
            if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0) {
                showToast('Podaj prawidłowy wynik meczu (liczby od 0 wzwyż).', 'error');
                return;
            }

            if (m.stage !== 'regular' && hs === as) {
                showToast('W fazie pucharowej mecz musi mieć zwycięzcę (wpisz wynik po dogrywce/karnych)!', 'error');
                return;
            }

            const wasAlreadyFinished = m.status === 'finished';
            m.homeScore = hs;
            m.awayScore = as;
            m.status = 'finished';
            m.finishedAt = Date.now();
            m.bettingOpen = false;

            const homeUser = getUserById(m.homeId);
            const awayUser = getUserById(m.awayId);

            if (!wasAlreadyFinished) {
                const K = Number(appState.config.eloKFactor) || 32;
                const gainMult = (Number(appState.config.eloGainPct) || 100) / 100;
                const lossMult = (Number(appState.config.eloLossPct) || 100) / 100;

                const expHome = 1 / (1 + Math.pow(10, (awayUser.elo - homeUser.elo) / 400));
                const actualHome = hs > as ? 1 : (hs === as ? 0.5 : 0);
                const rawDeltaHome = K * (actualHome - expHome);

                if (rawDeltaHome >= 0) {
                    homeUser.elo = Math.round(homeUser.elo + rawDeltaHome * gainMult);
                    awayUser.elo = Math.max(800, Math.round(awayUser.elo - rawDeltaHome * lossMult));
                } else {
                    const absDelta = Math.abs(rawDeltaHome);
                    homeUser.elo = Math.max(800, Math.round(homeUser.elo - absDelta * lossMult));
                    awayUser.elo = Math.round(awayUser.elo + absDelta * gainMult);
                }

                if (hs > as) {
                    homeUser.currentStreak = (homeUser.currentStreak || 0) + 1;
                    if (homeUser.currentStreak > (homeUser.bestStreak || 0)) homeUser.bestStreak = homeUser.currentStreak;
                    awayUser.currentStreak = 0;
                } else if (as > hs) {
                    awayUser.currentStreak = (awayUser.currentStreak || 0) + 1;
                    if (awayUser.currentStreak > (awayUser.bestStreak || 0)) awayUser.bestStreak = awayUser.currentStreak;
                    homeUser.currentStreak = 0;
                } else {
                    homeUser.currentStreak = 0;
                    awayUser.currentStreak = 0;
                }

                const matchBonus = Math.round(m.matchTaxPool || 0);
                const matchTaxPct = appState.config.matchWinnerTaxPct;
                if (matchBonus > 0) {
                    if (hs > as) {
                        const oldPts = homeUser.points || 0;
                        homeUser.points = Math.round(oldPts + matchBonus);
                        logBalanceChange(homeUser.id, matchBonus, oldPts, homeUser.points, 'Premia Meczowa (z wpłat)', `Wygrany mecz z ${awayUser.name} (podatek ${matchTaxPct}%)`);
                        showToast(`${homeUser.name} otrzymuje +${matchBonus} pkt premii z podatku bukmacherskiego (${matchTaxPct}%) za wygrany mecz!`, 'info');
                    } else if (as > hs) {
                        const oldPts = awayUser.points || 0;
                        awayUser.points = Math.round(oldPts + matchBonus);
                        logBalanceChange(awayUser.id, matchBonus, oldPts, awayUser.points, 'Premia Meczowa (z wpłat)', `Wygrany mecz z ${homeUser.name} (podatek ${matchTaxPct}%)`);
                        showToast(`${awayUser.name} otrzymuje +${matchBonus} pkt premii z podatku bukmacherskiego (${matchTaxPct}%) za wygrany mecz!`, 'info');
                    } else {
                        t.jackpotPool = Math.round((t.jackpotPool || 0) + matchBonus);
                    }
                }
            }

            // Najpierw rozlicz kupony meczowe (dzięki temu podatek od wypłaty zasili pulę turnieju przed ewentualnym finałem)
            reevaluateAllPendingBets();

            if (t.type === 'league') {
                const rem = t.matches.filter(x => x.status === 'scheduled');
                if (rem.length === 0 && t.status !== 'completed') {
                    const standings = computeTournamentStandings(t, 'regular');
                    if (standings.length > 0) {
                        crownTournamentChampion(t, standings[0].id);
                    }
                }
            }

            checkAndAdvancePlayoffs(t);
            reevaluateAllPendingBets();
            logAdminAction('Wynik Meczu', `Zapisano wynik meczu w "${t.name}": ${homeUser.name} ${hs}:${as} ${awayUser.name}`);
            saveState();
            renderAll();
            showToast(`Zapisano wynik meczu: ${homeUser.name} ${hs}:${as} ${awayUser.name}`, 'success');
        }

        function cancelMatchByAdmin(tournamentId, matchId) {
            const t = appState.tournaments.find(x => x.id === tournamentId);
            if (!t) return;
            const m = t.matches.find(x => x.id === matchId);
            if (!m) return;

            m.status = 'cancelled';
            m.homeScore = null;
            m.awayScore = null;
            m.bettingOpen = false;

            appState.bets.forEach(bet => {
                if (bet.status === 'pending' && bet.selections.some(s => s.matchId === matchId)) {
                    bet.status = 'cancelled';
                    const u = getUserById(bet.userId);
                    const oldPts = u.points || 0;
                    const refund = Math.round(Number(bet.stake));
                    u.points = Math.round(oldPts + refund);
                    logBalanceChange(u.id, refund, oldPts, u.points, 'Zwrot Kuponu', `Zwrot stawki za anulowany mecz (${getUserById(m.homeId).name} vs ${getUserById(m.awayId).name})`);
                }
            });

            logAdminAction('Anulowanie Meczu', `Anulowano mecz ${getUserById(m.homeId).name} vs ${getUserById(m.awayId).name} w turnieju "${t.name}"`);
            saveState();
            renderAll();
            showToast('Mecz został anulowany, a powiązane nierozliczone zakłady zwrócone graczom.', 'info');
        }

        function cancelTournamentByAdmin(tournamentId) {
            const t = appState.tournaments.find(x => x.id === tournamentId);
            if (!t) return;
            t.status = 'cancelled';
            t.bettingLocked = true;

            appState.bets.forEach(bet => {
                if (bet.status === 'pending' && bet.selections.some(s => s.tournamentId === tournamentId)) {
                    bet.status = 'cancelled';
                    const u = getUserById(bet.userId);
                    const oldPts = u.points || 0;
                    const refund = Math.round(Number(bet.stake));
                    u.points = Math.round(oldPts + refund);
                    logBalanceChange(u.id, refund, oldPts, u.points, 'Zwrot Kuponu', `Zwrot stawki za anulowany turniej "${t.name}"`);
                }

                </div>
                `,
                `

                <button onclick="executePointsTransfer()" class="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold">Wyślij przelew</button>
                `
            );
        }

        function executePointsTransfer() {
            const recipientId = document.getElementById('transfer-recipient').value;
            const amount = Math.floor(Number(document.getElementById('transfer-amount').value));
            const note = document.getElementById('transfer-note').value.trim() || 'Przelew punktów';

            if (!recipientId || isNaN(amount) || amount <= 0) {
                showToast('Podaj prawidłową kwotę przelewu.', 'error');
                return;
            }
            if (amount > currentUser.points) {
                showToast('Nie masz wystarczającej liczby punktów na koncie!', 'error');
                return;
            }

            const sender = getUserById(currentUser.id);
            const receiver = getUserById(recipientId);

            const senderOld = sender.points;
            const receiverOld = receiver.points;

            sender.points -= amount;
            receiver.points += amount;

            appState.transfers.unshift({
                id: 'tr_' + Date.now(),
                date: nowStr(),
                fromId: sender.id,
                toId: receiver.id,
                amount,
                note
            });

            logBalanceChange(sender.id, -amount, senderOld, sender.points, 'Przelew Wychodzący', `Przelew do gracza ${receiver.name}: "${note}"`);
            logBalanceChange(receiver.id, amount, receiverOld, receiver.points, 'Przelew Przychodzący', `Przelew od gracza ${sender.name}: "${note}"`);

            closeModal();
            saveState();
            renderAll();
            showToast(`Przelano ${amount} pkt do gracza ${receiver.name}!`, 'success');
        }

            const t = appState.tournaments.find(x => x.id === tournamentId);
            if (!t) return;
            const nextRound = t.currentRound + 1;
            const newMatches = generateSwissRoundMatches(t, nextRound);
            t.currentRound = nextRound;
            t.matches.push(...newMatches);
            saveState();
            renderAll();
            showToast(`Wylosowano Kolejkę ${nextRound} (Równy z Równym bez powtórzeń par)!`, 'success');
        }

        function changeSwissTotalRounds(tournamentId, newTotal) {
            const t = appState.tournaments.find(x => x.id === tournamentId);
            if (!t) return;
            const val = parseInt(newTotal, 10);
            if (val < t.currentRound) {
                showToast(`Aktualnie trwa już kolejka ${t.currentRound}!`, 'error');
                renderAll();
                return;
            }
            t.totalRounds = val;
            saveState();
            renderAll();

        /********************************************************************
         * 10. WIDOK 2: BUKMACHERKA (SOLO / COMBI, BRAMKI 1-5, CAŁY TURNIEJ)
         ********************************************************************/
        function isSelectionInSlip(matchOrTourneyId, code) {
            return betSlip.some(s => (s.matchId === matchOrTourneyId || s.tournamentId === matchOrTourneyId) && s.code === code);
        }

        // Wyliczanie tych samych dwóch podatków (na mecz oraz na turniej) PRZY WPŁACIE i PRZY WYPŁACIE
        function computeSlipNumbers(stakeVal) {
            const stake = Math.max(0, Math.floor(Number(stakeVal) || 0));
            const totalOdds = betSlip.length > 0 ? Number(betSlip.reduce((acc, s) => acc * Number(s.odds), 1).toFixed(2)) : 0;
            const matchTaxPct = Number(appState.config.matchWinnerTaxPct) ?? 4;
            const tourneyTaxPct = Number(appState.config.tournamentWinnerTaxPct) ?? 1;

            const hasMatchSelections = betSlip.some(s => s.kind === 'match');

            // 1. Podatki PRZY WPŁACIE (od postawionej sumy):
            // Jeśli kupon dotyczy meczu, pobierany jest podatek na mecz + podatek na turniej.
            // Jeśli kupon dotyczy wyłącznie Zwycięzcy Turnieju, pobierany jest podatek na turniej.
            const stakeMatchTaxPts = hasMatchSelections ? Math.round(stake * (matchTaxPct / 100)) : 0;
            const stakeTourneyTaxPts = Math.round(stake * (tourneyTaxPct / 100));
            const netStake = Math.max(0, stake - stakeMatchTaxPts - stakeTourneyTaxPts);

            // Kwota wygranej przed podatkiem od wypłaty:
            const grossWin = Math.round(netStake * totalOdds);

            // 2. Te same dwa podatki PRZY WYPŁACIE (od wygranej sumy):
            const payoutMatchTaxPts = hasMatchSelections ? Math.round(grossWin * (matchTaxPct / 100)) : 0;
            const payoutTourneyTaxPts = Math.round(grossWin * (tourneyTaxPct / 100));
            const potentialWin = Math.max(0, grossWin - payoutMatchTaxPts - payoutTourneyTaxPts);

            return {
                stake,
                totalOdds,
                hasMatchSelections,
                matchTaxPct,
                tourneyTaxPct,
                stakeMatchTaxPts,
                stakeTourneyTaxPts,
                netStake,
                grossWin,
                payoutMatchTaxPts,
                payoutTourneyTaxPts,
                potentialWin
            };
        }

        // Funkcja aktualizująca na żywo wartości podatków i wygranej bez przeładowania DOM inputa (naprawia klawiaturę na telefonie)
        function updateSlipStakeLive(rawVal) {
            slipStake = Number(rawVal) || 0;
            const calc = computeSlipNumbers(slipStake);
            const elStakeMatchTax = document.getElementById('slip-stake-match-tax-val');
            const elStakeTourneyTax = document.getElementById('slip-stake-tourney-tax-val');
            const elGrossWin = document.getElementById('slip-gross-win-val');
            const elPayoutMatchTax = document.getElementById('slip-payout-match-tax-val');
            const elPayoutTourneyTax = document.getElementById('slip-payout-tourney-tax-val');
            const elPotWin = document.getElementById('slip-potential-win-val');

            if (elStakeMatchTax) elStakeMatchTax.textContent = `${calc.stakeMatchTaxPts} pkt`;
            if (elStakeTourneyTax) elStakeTourneyTax.textContent = `${calc.stakeTourneyTaxPts} pkt`;
            if (elGrossWin) elGrossWin.textContent = `${calc.grossWin} pkt`;
            if (elPayoutMatchTax) elPayoutMatchTax.textContent = `${calc.payoutMatchTaxPts} pkt`;
            if (elPayoutTourneyTax) elPayoutTourneyTax.textContent = `${calc.payoutTourneyTaxPts} pkt`;
            if (elPotWin) elPotWin.textContent = `${calc.potentialWin} pkt`;
        }

        function isSelectionAllowedForPlayer(selObj, m) {
            const rule = appState.config.ownMatchBetRule || 'allow_all';
            if (selObj.kind !== 'match' || !m) return { allowed: true };
            const isParticipant = m.homeId === currentUser.id || m.awayId === currentUser.id;
            if (!isParticipant || rule === 'allow_all') return { allowed: true };

            if (rule === 'block') {
                return { allowed: false, reason: 'Nie możesz obstawiać meczu, w którym sam bierzesz udział!' };
            }
            if (rule === 'self_only') {
                const isHome = m.homeId === currentUser.id;
                const allowedCode = isHome ? '1X2_1' : '1X2_2';
                const allowedGoalsPrefix = isHome ? 'HOME_OVER_' : 'AWAY_OVER_';
                if (selObj.code === allowedCode || selObj.code.startsWith(allowedGoalsPrefix) || selObj.code.startsWith('TOT_OVER_')) {
                    return { allowed: true };
                }
                return { allowed: false, reason: 'We własnym meczu możesz obstawiać wyłącznie na samego siebie!' };
            }
            return { allowed: true };
        }

        function toggleSelectionOnSlip(selObj) {
            if (appState.config.globalBettingLocked) {
                showToast('Obstawianie jest aktualnie zablokowane przez Administratora (trwa mecz LIVE)!', 'error');
                return;
            }

            if (selObj.kind === 'match') {
                const t = appState.tournaments.find(x => x.id === selObj.tournamentId);
                const m = t ? t.matches.find(x => x.id === selObj.matchId) : null;
                const check = isSelectionAllowedForPlayer(selObj, m);
                if (!check.allowed) {
                    showToast(check.reason, 'error');
                    return;
                }
            }

            const existingIdx = betSlip.findIndex(s =>
                (selObj.kind === 'match' && s.matchId === selObj.matchId && s.code === selObj.code) ||
                (selObj.kind === 'outright' && s.tournamentId === selObj.tournamentId && s.code === selObj.code)
            );

            if (existingIdx > -1) {
                betSlip.splice(existingIdx, 1);
            } else {
                const sameMarketConflictIdx = betSlip.findIndex(s =>
                    (selObj.kind === 'match' && s.matchId === selObj.matchId && s.marketGroup === selObj.marketGroup) ||
                    (selObj.kind === 'outright' && s.tournamentId === selObj.tournamentId && s.kind === 'outright')
                );
                if (sameMarketConflictIdx > -1) {
                    betSlip[sameMarketConflictIdx] = selObj;
                } else {
                    betSlip.push(selObj);
                }
            }
            updateHeaderUserUI();
            renderBookmakerTab();
        }

        function placeBetFromSlip() {
            if (appState.config.globalBettingLocked) {
                showToast('Bukmacher został zablokowany przez Administratora!', 'error');
                return;
            }
            if (betSlip.length === 0) {
                showToast('Dodaj przynajmniej jedno zdarzenie do kuponu!', 'error');
                return;
            }
            const inputEl = document.getElementById('slip-stake-input');
            const stake = Math.floor(Number(inputEl ? inputEl.value : slipStake));
            if (isNaN(stake) || stake < 5) {
                showToast('Minimalna stawka kuponu to 5 pkt.', 'error');
                return;
            }
            if (stake > currentUser.points) {
                showToast('Nie masz tylu punktów na saldzie!', 'error');
                return;
            }

            for (const sel of betSlip) {
                const t = appState.tournaments.find(x => x.id === sel.tournamentId);
                if (!t || t.status !== 'active' || t.bettingLocked) {
                    showToast(`Turniej "${t ? t.name : ''}" ma zablokowane zakłady!`, 'error');
                    return;
                }
                if (sel.kind === 'match') {
                    const m = t.matches.find(x => x.id === sel.matchId);
                    if (!m || m.status !== 'scheduled' || !m.bettingOpen) {
                        showToast('Jeden z meczów na kuponie już się rozpoczął lub został zablokowany!', 'error');
                        return;
                    }
                    const check = isSelectionAllowedForPlayer(sel, m);
                    if (!check.allowed) {
                        showToast(check.reason, 'error');
                        return;
                    }
                }
            }

            const calc = computeSlipNumbers(stake);
            const userObj = getUserById(currentUser.id);
            const oldPts = userObj.points;
            userObj.points -= stake;

            logBalanceChange(
                userObj.id,
                -stake,
                oldPts,
                userObj.points,
                'Postawiony Kupon',
                `Kupon ${betSlip.length === 1 ? 'SOLO' : 'COMBI (' + betSlip.length + ')'} po kursie ${calc.totalOdds} (Ew. wygrana netto: ${calc.potentialWin} pkt)`
            );

            // Rozdzielenie podatków PRZY WPŁACIE:
            const matchSelections = betSlip.filter(s => s.kind === 'match');
            if (matchSelections.length > 0 && calc.stakeMatchTaxPts > 0) {
                const perMatchBonus = calc.stakeMatchTaxPts / matchSelections.length;
                matchSelections.forEach(s => {
                    const t = appState.tournaments.find(x => x.id === s.tournamentId);
                    if (t) {
                        const m = t.matches.find(x => x.id === s.matchId);
                        if (m) m.matchTaxPool = (m.matchTaxPool || 0) + perMatchBonus;
                    }
                });
            }

            if (calc.stakeTourneyTaxPts > 0 && betSlip.length > 0) {
                const perSelectionTourneyBonus = calc.stakeTourneyTaxPts / betSlip.length;
                betSlip.forEach(s => {
                    const t = appState.tournaments.find(x => x.id === s.tournamentId);
                    if (t) t.jackpotPool = (t.jackpotPool || 0) + perSelectionTourneyBonus;
                });
            }

            appState.bets.unshift({
                id: 'bet_' + Date.now(),
                createdAtMs: Date.now(),
                userId: currentUser.id,
                type: betSlip.length === 1 ? 'SOLO' : `COMBI (${betSlip.length})`,
                createdAt: nowStr(),
                stake,
                totalOdds: calc.totalOdds,
                grossWin: calc.grossWin,
                potentialWin: calc.potentialWin,
                matchTax: calc.stakeMatchTaxPts,
                tourneyTax: calc.stakeTourneyTaxPts,
                payoutMatchTax: calc.payoutMatchTaxPts,
                payoutTourneyTax: calc.payoutTourneyTaxPts,
                status: 'pending',
                selections: [...betSlip]
            });

            betSlip = [];
            saveState();
            renderAll();
            showToast(`Postawiono kupon za ${stake} pkt! Ew. wygrana netto: ${calc.potentialWin} pkt`, 'success');
        }

            const mostGoalsForRecord = [...allStats].sort((a, b) => b.goalsFor - a.goalsFor)[0];

            // Rekordy bukmacherskie (saldo): największa wygrana pkt, najwyższy trafiony kurs, największa przegrana pkt
            const wonBets = appState.bets.filter(b => b.status === 'won');
            const lostBets = appState.bets.filter(b => b.status === 'lost');

            const biggestBetWin = wonBets.length > 0
                ? [...wonBets].sort((a, b) => Number(b.potentialWin) - Number(a.potentialWin))[0]
                : null;
            const highestOddWin = wonBets.length > 0
                ? [...wonBets].sort((a, b) => Number(b.totalOdds) - Number(a.totalOdds))[0]
                : null;
            const biggestBetLoss = lostBets.length > 0
                ? [...lostBets].sort((a, b) => Number(b.stake) - Number(a.stake))[0]
                : null;

            let biggestWin = { diff: -1, scoreStr: 'Brak', winnerName: '-', loserName: '-', tourney: '-' };
            const checkMatchForBiggestWin = (homeId, awayId, hs, as, label) => {
                if (hs === null || as === null || hs === as) return;
                const diff = Math.abs(hs - as);
                if (diff > biggestWin.diff || (diff === biggestWin.diff && Math.max(hs, as) > 0)) {
                    const wId = hs > as ? homeId : awayId;
                    const lId = hs > as ? awayId : homeId;
                    biggestWin = {
                        diff,
                        scoreStr: `${Math.max(hs, as)} : ${Math.min(hs, as)}`,
                        winnerName: getUserById(wId).name,
                        loserName: getUserById(lId).name,
                        tourney: label
                    };
                }
            };

            appState.tournaments.forEach(t => {
                if (t.status === 'cancelled') return;
                t.matches.forEach(m => {
                    if (m.status === 'finished') {
                        checkMatchForBiggestWin(m.homeId, m.awayId, Number(m.homeScore), Number(m.awayScore), t.name);
                    }
                });
            });
            appState.historicalMatches.forEach(hm => {
                checkMatchForBiggestWin(hm.homeId, hm.awayId, Number(hm.homeScore), Number(hm.awayScore), hm.tournamentName);

            container.innerHTML = `

        function createNewTournamentFromAdmin() {
            const name = document.getElementById('nt-name').value.trim() || 'Nowy Turniej FIFA';
            const type = document.getElementById('nt-type').value;
            const totalRounds = parseInt(document.getElementById('nt-rounds').value, 10) || 3;
            const advancingCount = parseInt(document.getElementById('nt-advancing').value, 10) || 4;
            const swissFinalType = document.getElementById('nt-final-type').value;
            const pairingMode = document.getElementById('nt-pairing-mode').value;
            const bettingMode = document.getElementById('nt-betting-mode').value;

            const checkedPlayers = Array.from(document.querySelectorAll('.nt-player-cb:checked')).map(cb => cb.value);
            if (checkedPlayers.length < 2) {
                showToast('Zaznacz przynajmniej 2 graczy do turnieju!', 'error');
                return;
            }

            const newTourney = {
                id: 't_' + Date.now(),
                name,
                type,
                status: 'active',
                createdAt: nowStr(),
                playerIds: checkedPlayers,
                totalRounds,
                currentRound: 1,
                advancingCount,
                swissFinalType,
                phase: type === 'cup_elo' ? 'playoffs' : 'regular',
                bettingMode,
                bettingLocked: false,
                jackpotPool: 0,
                winnerId: null,
                matches: []
            };

            const openBet = bettingMode === 'matches' || bettingMode === 'both';

            if (pairingMode === 'manual' && manualPairingsTemp.length > 0) {
                newTourney.matches = manualPairingsTemp.map((p, idx) => ({
                    id: `m_${newTourney.id}_man_${idx}`,
                    tournamentId: newTourney.id,
                    round: 1,
                    stage: type === 'cup_elo' ? 'playoff_sf' + (idx + 1) : 'regular',
                    stageLabel: 'Mecz Ustawiony Ręcznie (Kolejka 1)',
                    homeId: p.homeId,
                    awayId: p.awayId,
                    homeScore: null,
                    awayScore: null,
                    status: 'scheduled',
                    matchTaxPool: 0,
                    bettingOpen: openBet,
                    markets: { m1x2: true, totalGoals: true, playerGoals: true }
                }));
            } else if (type === 'swiss') {
                newTourney.matches = generateSwissRoundMatches(newTourney, 1);
            } else if (type === 'league' || type === 'league_cup') {
                let matchIdx = 0;
                for (let i = 0; i < checkedPlayers.length; i++) {
                    for (let j = i + 1; j < checkedPlayers.length; j++) {
                        matchIdx++;
                        newTourney.matches.push({
                            id: `m_${newTourney.id}_rr_${matchIdx}`,
                            tournamentId: newTourney.id,
                            round: matchIdx,
                            stage: 'regular',
                            stageLabel: `Liga (Każdy z każdym)`,
                            homeId: checkedPlayers[i],
                            awayId: checkedPlayers[j],
                            homeScore: null,
                            awayScore: null,
                            status: 'scheduled',
                            matchTaxPool: 0,
                            bettingOpen: openBet,
                            markets: { m1x2: true, totalGoals: true, playerGoals: true }
                        });
                    }
                }
            } else if (type === 'cup_elo') {
                const sorted = [...checkedPlayers].map(id => getUserById(id)).sort((a, b) => b.elo - a.elo);
                const half = Math.floor(sorted.length / 2);
                for (let i = 0; i < half; i++) {
                    newTourney.matches.push({
                        id: `m_${newTourney.id}_cup_${i}`,
                        tournamentId: newTourney.id,
                        round: 90,
                        stage: half === 2 ? `playoff_sf${i + 1}` : 'playoff_final',
                        stageLabel: `Puchar ELO (Górny Koszyk #${i + 1} vs Dolny Koszyk #${sorted.length - i})`,
                        homeId: sorted[i].id,
                        awayId: sorted[sorted.length - 1 - i].id,
                        homeScore: null,
                        awayScore: null,
                        status: 'scheduled',
                        matchTaxPool: 0,
                        bettingOpen: openBet,
                        markets: { m1x2: true, totalGoals: true, playerGoals: true }
                    });
                }
            }

            manualPairingsTemp = [];
            appState.tournaments.unshift(newTourney);
            selectedTournamentId = newTourney.id;
            logAdminAction('Nowy Turniej', `Utworzono turniej "${name}" (Format: ${type}, Graczy: ${checkedPlayers.length}, Awans: TOP ${advancingCount})`);
            saveState();
            switchMainTab('tournaments');
            showToast(`Utworzono turniej "${name}"!`, 'success');
        }

                t.matches.forEach(m => {

                });

            renderAdminTab();
            showToast('Zmieniono tryb bukmacherski turnieju.', 'info');

            const t = appState.tournaments.find(x => x.id === tId);

            const m = t.matches.find(x => x.id === mId);
            if (m) m.bettingOpen = isOpen;

            const t = appState.tournaments.find(x => x.id === tId);

            const m = t.matches.find(x => x.id === mId);
            if (m) {
                if (!m.markets) m.markets = { m1x2: true, totalGoals: true, playerGoals: true };
                m.markets[key] = val;

            saveState();
        }

        function saveUserEditFromAdmin(userId) {
            const u = getUserById(userId);
            if (!u) return;

            const oldLogin = u.login;
            const oldPass = u.password;
            const oldName = u.name;
            const oldElo = Math.round(u.elo);
            const oldPts = Math.round(u.points);
            const oldTrophies = u.trophies || 0;

            const newLogin = document.getElementById(`edit_login_${userId}`).value.trim() || u.login;
            const newPass = document.getElementById(`edit_pass_${userId}`).value.trim() || u.password;
            const newName = document.getElementById(`edit_name_${userId}`).value.trim() || u.name;
            const newElo = Number(document.getElementById(`edit_elo_${userId}`).value) || 1200;
            const newPts = Number(document.getElementById(`edit_pts_${userId}`).value) || 0;
            const newTrophies = Number(document.getElementById(`edit_trophies_${userId}`).value) || 0;

            const changes = [];
            if (oldLogin !== newLogin) changes.push(`Login: ${oldLogin} -> ${newLogin}`);
            if (oldName !== newName) changes.push(`Nazwa: ${oldName} -> ${newName}`);
            if (oldPass !== newPass) changes.push(`Hasło: zmieniono (${oldPass} -> ${newPass})`);
            if (oldElo !== Math.round(newElo)) changes.push(`ELO: ${oldElo} -> ${Math.round(newElo)}`);
            if (oldPts !== Math.round(newPts)) changes.push(`Punkty: ${oldPts} -> ${Math.round(newPts)}`);
            if (oldTrophies !== newTrophies) changes.push(`Puchary: ${oldTrophies} -> ${newTrophies}`);

            u.login = newLogin;
            u.password = newPass;
            u.name = newName;
            u.elo = newElo;
            u.points = newPts;
            u.trophies = newTrophies;

            if (oldPts !== Math.round(newPts)) {
                logBalanceChange(
                    u.id,
                    Math.round(newPts) - oldPts,
                    oldPts,
                    Math.round(newPts),
                    'Korekta Admina',
                    `Ręczna zmiana salda w Panelu Admina przez ${currentUser ? currentUser.name : 'Admina'}`
                );
            }

            if (changes.length > 0) {
                logAdminAction('Edycja Gracza', `Gracz ${u.name}: ${changes.join(', ')}`);
            }

            saveState();
            renderAll();
            showToast(`Zaktualizowano konto gracza ${u.name}!`, 'success');
        }

        function addHistoricalMatchFromAdmin() {
            const homeId = document.getElementById('hm-home').value;
            const awayId = document.getElementById('hm-away').value;
            const hs = parseInt(document.getElementById('hm-hs').value, 10);
            const as = parseInt(document.getElementById('hm-as').value, 10);
            if (homeId === awayId) {
                showToast('Wybierz dwóch różnych graczy!', 'error');
                return;
            }
            const hUser = getUserById(homeId);
            const aUser = getUserById(awayId);

            hUser.seedMatches = (hUser.seedMatches || 0) + 1;
            aUser.seedMatches = (aUser.seedMatches || 0) + 1;
            hUser.seedGoalsFor = (hUser.seedGoalsFor || 0) + hs;
            hUser.seedGoalsAgainst = (hUser.seedGoalsAgainst || 0) + as;
            aUser.seedGoalsFor = (aUser.seedGoalsFor || 0) + as;
            aUser.seedGoalsAgainst = (aUser.seedGoalsAgainst || 0) + hs;

            if (hs > as) { hUser.seedWins = (hUser.seedWins || 0) + 1; aUser.seedLosses = (aUser.seedLosses || 0) + 1; }
            else if (hs < as) { aUser.seedWins = (aUser.seedWins || 0) + 1; hUser.seedLosses = (hUser.seedLosses || 0) + 1; }
            else { hUser.seedDraws = (aUser.seedDraws || 0) + 1; aUser.seedDraws = (aUser.seedDraws || 0) + 1; }

            appState.historicalMatches.unshift({
                id: 'hm_' + Date.now(),
                createdAtMs: Date.now(),
                date: nowStr(),
                tournamentName: 'Archiwum FIFA',
                homeId,
                awayId,
                homeScore: hs,
                awayScore: as
            });

            logAdminAction('Dodanie Meczu Archiwalnego', `Dopisano mecz do historii: ${hUser.name} ${hs}:${as} ${aUser.name}`);
            saveState();
            renderAdminTab();
            showToast('Dopisano mecz historyczny i zaktualizowano kursy bramkowe graczy!', 'success');
        }
